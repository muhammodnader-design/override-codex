<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Override Zone — Codex & Reader</title>
<meta name="description" content="Interactive codex and online reader for the Override Zone novel universe: characters, factions, illustrations, and full novels." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      <a href="#/gallery">Gallery</a>
